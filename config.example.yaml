channel_name: Wuhan Bites
language: en
video:
  width: 1080
  height: 1920
  fps: 30
  seconds_per_scene: 4
script:
  provider: template        # template | anthropic
  model: claude-sonnet-5-5
voice:
  provider: auto            # auto | edge-tts | macos-say | silent
  voice_name: en-US-AriaNeural   # edge-tts voice
  say_voice: Samantha            # macOS `say` voice (see: say -v '?')
images:
  provider: illustrated     # illustrated | placeholder
publish:
  dry_run: true
  platforms: [youtube_shorts]   # tiktok, instagram_reels: no uploader yet
  youtube:
    privacy: private        # private | unlisted | public (start private!)
    category_id: "19"       # 19 Travel & Events, 26 Howto & Style
    client_secret: secrets/client_secret.json
    token: secrets/youtube_token.json
